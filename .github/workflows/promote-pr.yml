name: Промоут dev → main

# Держит открытым PR dev → main, пока в dev есть коммиты, которых нет в main.
# Ничего не мерджит: слияние делает человек.
# Нужна настройка репозитория: Settings → Actions → General → Workflow permissions →
# «Allow GitHub Actions to create and approve pull requests».
# Обязательные проверки validate, secret-scan, integration у PR берутся из запуска
# ci.yml на push в dev: head PR — dev, коммит тот же.
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: promote-dev-main
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: dev
          # Полная история всех веток: скрипту нужны origin/main и origin/dev.
          fetch-depth: 0
          persist-credentials: false

      - name: Открыть или обновить PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # CONTRIBUTING.md: промоут-PR не попадают в release notes.
          PROMOTE_LABEL: skip-changelog
        run: bash .github/scripts/promote-pr.sh
