name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Preflight production secrets and configs
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RCON_PASSWORD: ${{ secrets.RCON_PASSWORD }}
          MANAGEMENT_SERVER_SECRET: ${{ secrets.MANAGEMENT_SERVER_SECRET }}
          AUTHME_MYSQL_PASSWORD: ${{ secrets.AUTHME_MYSQL_PASSWORD }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          HEALTHCHECKS_BACKUP_URL: ${{ secrets.HEALTHCHECKS_BACKUP_URL }}
          HEALTHCHECKS_VPS_URL: ${{ secrets.HEALTHCHECKS_VPS_URL }}
          YANDEX_RCLONE_CONFIG: ${{ secrets.YANDEX_RCLONE_CONFIG }}
        run: |
          set -eu
          for name in \
            VPS_SSH_KEY VPS_HOST VPS_USER RCON_PASSWORD \
            MANAGEMENT_SERVER_SECRET AUTHME_MYSQL_PASSWORD RESTIC_PASSWORD \
            TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID DISCORD_BOT_TOKEN \
            HEALTHCHECKS_BACKUP_URL HEALTHCHECKS_VPS_URL YANDEX_RCLONE_CONFIG; do
            case "${!name}" in
              *[![:space:]]*) ;;
              *)
              echo "Required production secret is missing: $name"
              exit 1
              ;;
            esac
          done

          render_dir=$(mktemp -d)
          trap 'rm -rf "$render_dir"' EXIT
          python3 scripts/render-config.py \
            --source minecraft/server.properties \
            --output "$render_dir/server.properties" \
            --env-file /dev/null
          python3 scripts/render-config.py \
            --source minecraft/plugins/AuthMe/config.yml \
            --output "$render_dir/authme-config.yml" \
            --env-file /dev/null
      - name: Install SSH key
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%b\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          first_line=$(head -n 1 ~/.ssh/deploy_key)
          case "$first_line" in
            "-----BEGIN "*" PRIVATE KEY-----") ;;
            *) echo "VPS_SSH_KEY is not an OpenSSH/PEM private key"; exit 1 ;;
          esac
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Request deployment
        env:
          # Every secret below is passed through the process environment and
          # referenced as "$VAR" in the script, never interpolated directly
          # as ${{ secrets.X }} inside a quoted shell string. GitHub Actions
          # substitutes ${{ }} expressions as raw text before bash ever sees
          # the script, so a secret containing a double quote (e.g. the JSON
          # in YANDEX_RCLONE_CONFIG) would terminate the surrounding "..."
          # early and corrupt everything after it — which is exactly what
          # broke the rclone token previously.
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          RCON_PASSWORD: ${{ secrets.RCON_PASSWORD }}
          MANAGEMENT_SERVER_SECRET: ${{ secrets.MANAGEMENT_SERVER_SECRET }}
          AUTHME_MYSQL_PASSWORD: ${{ secrets.AUTHME_MYSQL_PASSWORD }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          HEALTHCHECKS_BACKUP_URL: ${{ secrets.HEALTHCHECKS_BACKUP_URL }}
          HEALTHCHECKS_VPS_URL: ${{ secrets.HEALTHCHECKS_VPS_URL }}
          YANDEX_RCLONE_CONFIG: ${{ secrets.YANDEX_RCLONE_CONFIG }}
          DEPLOY_REQUEST_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          archive="/tmp/minecraft-infra-${DEPLOY_REQUEST_ID}.tgz"
          request_dir="/srv/minecraft/deploy-requests/${DEPLOY_REQUEST_ID}"
          remote_archive="/tmp/minecraft-infra-${DEPLOY_REQUEST_ID}.tgz"
          secret_dir=$(mktemp -d)
          trap 'rm -rf "$secret_dir"' EXIT
          chmod 0700 "$secret_dir"
          umask 077
          printf '%s' "$RCON_PASSWORD" >"$secret_dir/rcon_password"
          printf '%s' "$MANAGEMENT_SERVER_SECRET" >"$secret_dir/management_server_secret"
          printf '%s' "$AUTHME_MYSQL_PASSWORD" >"$secret_dir/authme_mysql_password"
          printf '%s' "$RESTIC_PASSWORD" >"$secret_dir/restic_password"
          printf '%s' "$TELEGRAM_BOT_TOKEN" >"$secret_dir/telegram_bot_token"
          printf '%s' "$TELEGRAM_CHAT_ID" >"$secret_dir/telegram_chat_id"
          printf '%s' "$DISCORD_BOT_TOKEN" >"$secret_dir/discord_bot_token"
          printf '%s' "$HEALTHCHECKS_BACKUP_URL" >"$secret_dir/healthchecks_backup_url"
          printf '%s' "$HEALTHCHECKS_VPS_URL" >"$secret_dir/healthchecks_vps_url"
          printf '%s' "$YANDEX_RCLONE_CONFIG" >"$secret_dir/rclone.conf"
          tar --exclude='.git' --exclude='.opencode' -czf "$archive" .
          scp -i ~/.ssh/deploy_key "$archive" "$VPS_USER@$VPS_HOST:$remote_archive"
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "sudo mkdir -p '$request_dir' && sudo tar -xzf '$remote_archive' -C '$request_dir' && sudo rm -f '$remote_archive' && sudo chown -R root:root '$request_dir'"
          tar -czf - -C "$secret_dir" . | ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "sudo install -d -m 0700 '$request_dir/.secrets' && sudo tar -xzf - -C '$request_dir/.secrets'"
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "cd '$request_dir' && sudo DEPLOY_REQUEST_CLEANUP_REPO=true DEPLOY_SECRETS_DIR='$request_dir/.secrets' '$request_dir/scripts/deploy-request.sh'"

  release-draft:
    name: Update GitHub release draft
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check for a published stable baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          published_count=$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json isDraft,isPrerelease \
            | jq '[.[] | select(.isDraft == false and .isPrerelease == false)] | length')
          if [[ "$published_count" -eq 0 ]]; then
            echo "initial=true" >>"$GITHUB_OUTPUT"
            echo "No published stable release exists; preparing the v1.0.0 baseline draft."
          else
            echo "initial=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Draft initial v1.0.0 release
        if: steps.baseline.outputs.initial == 'true'
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          version: 1.0.0
          commitish: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Draft next SemVer release
        if: steps.baseline.outputs.initial == 'false'
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
