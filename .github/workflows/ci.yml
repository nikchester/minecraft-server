name: CI

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository validation
        run: python3 scripts/validate-repository.py
      - name: Configuration rendering tests
        run: python3 -m unittest discover -s test/config -v
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-pip
          python3 -m pip install --user ansible ansible-lint yamllint
      - name: YAML validation
        run: yamllint .
      - name: Shellcheck
        run: shellcheck -x -e SC1091 scripts/*.sh
      - name: Ansible syntax
        working-directory: ansible
        run: ansible-playbook -i inventory/production/hosts.example.yml playbooks/bootstrap.yml --syntax-check
      - name: Ansible lint
        working-directory: ansible
        run: ansible-lint .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run complete integration suite
        run: bash test/local/run-all.sh
