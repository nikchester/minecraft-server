name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\*_&'
no-changes-template: '- Нет изменений'
sort-by: merged_at
sort-direction: ascending

categories:
  - type: pre-exclude
    when:
      label: 'skip-changelog'
  - title: '🛠️ Надёжность и инфраструктура'
    exclusive: true
    when:
      label: 'area:infrastructure'
  - title: '⚠️ Для игроков — несовместимые изменения'
    semver-increment: major
    when:
      label: 'release:major'
  - title: '🎮 Для игроков — новые возможности'
    semver-increment: minor
    when:
      label: 'release:minor'
  - title: '🔧 Для игроков — исправления и улучшения'
    semver-increment: patch
    when:
      label: 'release:patch'
  - title: '📦 Прочие изменения'
    semver-increment: patch
  - type: version-resolver
    semver-increment: major
    when:
      label: 'release:major'
  - type: version-resolver
    semver-increment: minor
    when:
      label: 'release:minor'
  - type: version-resolver
    semver-increment: patch
    when:
      label: 'release:patch'
  - type: version-resolver
    semver-increment: patch

template: |
  # 🎉 The Tatarland Rebirth — релиз $RESOLVED_VERSION

  Изменения, вошедшие в этот выпуск после предыдущей стабильной версии:

  $CHANGES

  ## 📦 Версионирование и релизы

  Нумерация версий следует SemVer: `MAJOR.MINOR.PATCH`. Несовместимые изменения повышают MAJOR, новые совместимые возможности — MINOR, исправления и улучшения — PATCH.
