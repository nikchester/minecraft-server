# Require half of eligible players in each world; the plugin rounds up.
sleep-percentage: 50
skip-delay-ticks: 60
skip-type: instant
gradual-skip-speed-ticks: 30
morning-time: 1000
reset-time: true
per-world-sleep: true
require-all-players-online: false

# Preserve the existing behavior of clearing rain and thunderstorms after sleep.
clear-weather: true
reset-weather: true
clear-thunder: true
reset-thunder: true
reset-weather-cycle: true

# AFK players are ignored; spectators are not included in the threshold.
count-afk-as-sleeping: false
exclude-afk-from-total: true
count-spectators: false
count-flying: true
ignore-creative-mode: false

afk-detection:
  use-essentials: true
  use-cmi: true
  time-seconds: 300

ui:
  action-bar:
    enabled: true
  boss-bar:
    enabled: true
    color: BLUE
    style: SOLID
  progress-bar:
    enabled: true
    symbol: "■"
    length: 20
  title:
    enabled: false
    title: "&bДоброе утро!"
    subtitle: "&fНочь пропущена благодаря игроку &b%player%"
    fade-in: 10
    stay: 70
    fade-out: 20

sounds:
  enabled: true
  skip-sound: ENTITY_PLAYER_LEVELUP
  skip-sound-volume: 1.0
  skip-sound-pitch: 1.0
  night-sound: BLOCK_NOTE_BLOCK_PLING
  night-sound-volume: 0.5
  night-sound-pitch: 1.0
  storm-sound: ENTITY_LIGHTNING_BOLT_THUNDER
  storm-sound-volume: 1.0
  storm-sound-pitch: 1.0

# Prevent vanilla sleep percentage from racing the plugin's threshold.
manage-gamerule: true
check-for-updates: false
disabled-worlds: []
disabled-gamemodes: []
