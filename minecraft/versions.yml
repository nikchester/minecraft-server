minecraft:
  version: "1.21.8"
paper:
  build: 60
  download_url: "https://fill-data.papermc.io/v1/objects/274bbcb9807ad79a479617ce695a7c0686e652a8d1cabfd0e288d92a3ea29593/paper-26.2-124.jar"
java:
  major: 25
plugins:
  authme_reloaded:
    version: "5.6.0"
    required: true
    source: "manual"
    data_dir: "AuthMe"
    download_url: "https://github.com/AuthMe/AuthMeReloaded/releases/download/5.6.0/AuthMe-5.6.0.jar"
  coreprotect:
    version: "22.4"
    required: true
    source: "manual"
    data_dir: "CoreProtect"
    download_url: "https://cdn.modrinth.com/data/Lu3KuzdV/versions/llmrc4cl/CoreProtect-22.4.jar"
  chunky:
    version: "1.4.40"
    required: false
    source: "manual"
    data_dir: "Chunky"
    download_url: "https://cdn.modrinth.com/data/fALzjamp/versions/P3y2MXnd/Chunky-Bukkit-1.4.40.jar"
  dynamiclights:
    version: "0.1.1"
    required: false
    source: "manual"
    data_dir: "DynamicLights"
    download_url: "https://cdn.modrinth.com/data/F8hNkKfB/versions/rVrFWZ7P/DynamicLights-0.1.1-mc1.21.jar"
  discordsrv:
    version: "1.30.5"
    required: false
    source: "manual"
    data_dir: "DiscordSRV"
    download_url: "https://github.com/DiscordSRV/DiscordSRV/releases/download/v1.30.5/DiscordSRV-Build-1.30.5.jar"
  onlysleep:
    version: "1.4.2"
    required: true
    source: "modrinth"
    data_dir: "Onlysleep"
    download_url: "https://cdn.modrinth.com/data/Tr6srgFS/versions/X6Y39iU9/Onlysleep-1.4.2.jar"
shared_plugin_data_dirs:
  - "bStats"
notes:
  production_gate: "Paper artifact URL was provided by the owner and should be used for smoke tests and release preparation."
  plugin_gate: "Plugin download URLs were resolved from the projects' own release APIs (GitHub for AuthMe, Modrinth for CoreProtect/Chunky/DynamicLights) at the exact pinned versions above; verify before bumping versions."
  dynamiclights_config: "DynamicLights' own config.yml (in shared/plugins/DynamicLights, not committed) must keep track_mobs: false so held light sources on mobs don't emit dynamic light; scripts/ensure-dynamiclights-config.sh self-heals this on every deploy cycle."
  authme_config: "AuthMe's own config.yml (in shared/plugins/AuthMe, not committed) must keep settings.restrictions.timeout: 60 and settings.restrictions.maxRegPerIp: 0 (issue #13); scripts/ensure-authme-config.sh self-heals both on every deploy cycle."
  onlysleep_config: "Onlysleep 1.4.2 (issue #48) skips a night at 50% of eligible players per world, rounded up; player-facing messages are Russian, bStats and update checks are disabled. The shared bStats config directory is separately linked because bStats is global to the server, not an installable plugin."
