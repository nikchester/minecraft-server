services:
  minio:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: testkey
      RUSTFS_SECRET_KEY: testsecret123
      RUSTFS_VOLUMES: /data/rustfs0
    tmpfs:
      - /data:uid=10001,gid=10001,mode=0755
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 15

  test-runner:
    build:
      context: ../..
      dockerfile: test/local/Dockerfile
    depends_on:
      minio:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - rclone mkdir minio:minecraft-restic && exec /opt/test/run-tests.sh
    tmpfs:
      - /srv/minecraft
      - /etc/minecraft/secrets
    environment:
      # The stub's RCON server accepts any password (see stub/minecraft_stub.py),
      # so a plain env var is enough -- no need for a fixture file under
      # /etc/minecraft/secrets, which is tmpfs and empty by default anyway.
      RCON_PASSWORD: test-rcon-password
      MANAGEMENT_SERVER_SECRET: test-management-secret
      AUTHME_MYSQL_PASSWORD: test-authme-mysql-password
      AUTHME_MAIL_ACCOUNT: test@example.test
      AUTHME_MAIL_PASSWORD: test-authme-mail-password
      AUTHME_EMAIL_OAUTH2_TOKEN: test-authme-oauth-token
      AUTHME_LICENSE_KEY: test-authme-license-key
      AUTHME_LOGINSECURITY_MYSQL_PASSWORD: test-loginsecurity-password
      DISCORD_BOT_TOKEN: test-discord-bot-token
      RCLONE_CONFIG: /opt/test/fixtures/rclone.conf
      RESTIC_PASSWORD_FILE: /opt/test/fixtures/restic_password
      HEALTHCHECKS_BACKUP_URL_FILE: /opt/test/fixtures/healthchecks_backup_url
      TELEGRAM_TOKEN_FILE: /opt/test/fixtures/telegram_bot_token
      TELEGRAM_CHAT_FILE: /opt/test/fixtures/telegram_chat_id

  paper-plugin-smoke:
    profiles: ["plugins"]
    build:
      context: ../..
      dockerfile: test/local/PaperSmoke.Dockerfile
    init: true
    tmpfs:
      - /srv/minecraft
    environment:
      RCON_PASSWORD: ${RCON_PASSWORD:-local-paper-smoke-rcon}
      MANAGEMENT_SERVER_SECRET: ${MANAGEMENT_SERVER_SECRET:-local-paper-smoke-management}
      AUTHME_MYSQL_PASSWORD: ${AUTHME_MYSQL_PASSWORD:-local-paper-smoke-authme}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-BOTTOKEN}
      PAPER_SMOKE_TIMEOUT_SECONDS: 600
