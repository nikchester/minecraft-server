---
- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Allow Minecraft
  community.general.ufw:
    rule: allow
    port: '{{ minecraft_server_port }}'
    proto: tcp

# Geyser's NetherNet transport needs TCP for signaling and UDP for gameplay.
- name: Allow Bedrock signaling
  community.general.ufw:
    rule: allow
    port: '{{ minecraft_bedrock_port }}'
    proto: tcp

- name: Allow Bedrock gameplay
  community.general.ufw:
    rule: allow
    port: '{{ minecraft_bedrock_port }}'
    proto: udp

- name: Deny incoming by default
  community.general.ufw:
    default: deny
    direction: incoming

- name: Allow outgoing by default
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Enable firewall
  community.general.ufw:
    state: enabled

- name: Read firewall status
  ansible.builtin.command: ufw status verbose
  register: firewall_status
  changed_when: false

- name: Show firewall status
  ansible.builtin.debug:
    var: firewall_status.stdout_lines
